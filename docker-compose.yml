services:
  api:
    build: .
    container_name: create-maps-api
    init: true
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: ["node", "dist/startApiServer.js"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PHANTASMA_API_PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  backfill:
    build: .
    container_name: create-maps-backfill
    init: true
    env_file:
      - .env
    command: ["node", "dist/backfill.js"]
    restart: "no"
    profiles:
      - jobs

  sync:
    build: .
    container_name: create-maps-sync
    init: true
    env_file:
      - .env
    command: ["node", "dist/backfill.js"]
    restart: "no"
    profiles:
      - jobs
